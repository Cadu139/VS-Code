<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryTree Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <!-- Card de Login -->
        <section id="login-card" class="form-container">
            <h1>Acesse sua conta</h1>
            
            <form action="/login" method="POST" novalidate>
                <!-- Campo de E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <span></span>
                </div>
                <!-- Campo de Senha -->
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span></span>
                </div>

                <button type="submit" id="login-button" class="safe">Entrar</button>
            </form>

            <!-- Rodapé da seção de login com o link de cadastro -->
            <footer>
                <p>
                    Ainda não tem uma conta? 
                    <a href="#" id="signup-link">Crie uma agora!</a>.
                </p>
            </footer>
        </section>

        <!-- Card de Signup (inicialmente oculto) -->
        <section id="signup-card" class="form-container" style="display: none;">
            <h1>Crie sua conta</h1>
            
            <form action="/signup" method="POST" novalidate>
                <!-- Campo de Nome -->
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required>
                    <span></span>
                </div>

                <!-- Campo de E-mail -->
                <div class="form-group">
                    <label for="signup-email">E-mail</label>
                    <input type="email" id="signup-email" name="email" required autocomplete="email">
                    <span></span>
                </div>

                <!-- Campo de Senha -->
                <div class="form-group">
                    <label for="signup-password">Senha</label>
                    <input type="password" id="signup-password" name="password" required autocomplete="new-password">
                    <span></span>
                </div>

                <!-- Campo de Confirmar Senha -->
                <div class="form-group">
                    <label for="confirm-password">Confirme a Senha</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
                    <span></span>
                </div>

                <button type="submit" id="signup-button" class="safe">Cadastrar</button>
            </form>

            <!-- Rodapé da seção de signup com o link de login -->
            <footer>
                <p>
                    Já tem uma conta? 
                    <a href="#" id="login-link">Acesse aqui!</a>.
                </p>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
